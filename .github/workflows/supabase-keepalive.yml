# Maintient le projet Supabase actif : l'offre gratuite met un projet en pause
# après 7 jours d'activité jugée trop faible, et l'app a un usage saisonnier
# (kermesse). La doc Supabase indique que « quelques requêtes par jour »
# suffisent typiquement : un ping quotidien se place dans cette zone et rend
# négligeable le risque qu'une exécution planifiée saute (les crons GitHub
# peuvent être retardés ou ignorés en période de charge).
# Voir docs/OPERATIONS.md pour la procédure de réactivation manuelle.
#
# ⚠️ GitHub désactive les workflows planifiés après 60 jours sans activité
# (commit) sur le dépôt : un e-mail « scheduled workflow disabled » est envoyé,
# et il suffit de cliquer « Enable workflow » dans l'onglet Actions.
name: Supabase keepalive

on:
  schedule:
    # Tous les jours à 06:47 UTC (minute décalée : les crons à l'heure pile
    # sont les plus retardés par GitHub).
    - cron: '47 6 * * *'
  workflow_dispatch: # déclenchement manuel possible depuis l'onglet Actions

permissions:
  actions: write # nécessaire pour l'étape de réactivation du workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping de l'API REST Supabase
        # Requête anodine : SELECT id sur kermesse_events avec la clé anon.
        # La RLS réserve la lecture aux utilisateurs authentifiés : la réponse
        # est un tableau vide (200), aucune donnée n'est exposée — mais la
        # requête compte comme de l'activité API et empêche la mise en pause.
        run: |
          code=$(curl --silent --show-error --output /tmp/body --write-out '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/kermesse_events?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Réponse HTTP : ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Ping Supabase en échec (HTTP ${code}) — le projet est peut-être en pause. Voir docs/OPERATIONS.md."
            cat /tmp/body
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Réactiver le workflow (anti-désactivation GitHub 60 j)
        # GitHub désactive les workflows planifiés après 60 jours sans commit.
        # Réactiver le workflow par l'API remet a priori ce délai à zéro
        # (méthode de gautamkrishnar/keepalive-workflow v2, non documentée par GitHub).
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable supabase-keepalive.yml --repo "${{ github.repository }}"
