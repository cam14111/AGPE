# Maintient le projet Supabase actif : l'offre gratuite met un projet en pause
# après 7 jours sans requête API, et l'app a un usage saisonnier (kermesse).
# Deux pings par semaine laissent une marge confortable même si une exécution
# planifiée saute (les crons GitHub peuvent être retardés ou ignorés en période
# de charge). Voir docs/OPERATIONS.md pour la procédure de réactivation manuelle.
#
# ⚠️ GitHub désactive les workflows planifiés après 60 jours sans activité
# (commit) sur le dépôt : un e-mail « scheduled workflow disabled » est envoyé,
# et il suffit de cliquer « Enable workflow » dans l'onglet Actions.
name: Supabase keepalive

on:
  schedule:
    # Lundi et jeudi à 06:47 UTC (minute décalée : les crons à l'heure pile
    # sont les plus retardés par GitHub).
    - cron: '47 6 * * 1,4'
  workflow_dispatch: # déclenchement manuel possible depuis l'onglet Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping de l'API REST Supabase
        # Requête anodine : SELECT id sur kermesse_events avec la clé anon.
        # La RLS réserve la lecture aux utilisateurs authentifiés : la réponse
        # est un tableau vide (200), aucune donnée n'est exposée — mais la
        # requête compte comme de l'activité API et empêche la mise en pause.
        run: |
          # curl peut échouer AVANT toute réponse HTTP (DNS injoignable, timeout,
          # connexion refusée) : c'est précisément le symptôme d'un projet EN PAUSE,
          # dont le sous-domaine cesse de résoudre. Le job tourne sous `bash -e` ;
          # sans le « || curl_rc=$? » ci-dessous, l'échec de curl interromprait le
          # script sur l'affectation et le message d'aide ne s'afficherait jamais
          # (on ne verrait que le « curl: (6) » brut). --retry-all-errors relance
          # aussi sur ces erreurs de transport pour absorber un hoquet réseau
          # passager du runner et éviter les fausses alertes.
          curl_rc=0
          code=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --output /tmp/body --write-out '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/kermesse_events?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}") || curl_rc=$?

          if [ "${curl_rc}" -ne 0 ]; then
            echo "::error::Ping Supabase impossible (curl ${curl_rc} : hôte injoignable après 3 tentatives) — le projet est très probablement EN PAUSE. Réactivation manuelle : voir docs/OPERATIONS.md §1."
            exit 1
          fi

          echo "Réponse HTTP : ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Ping Supabase en échec (HTTP ${code}) — le projet est peut-être en pause. Voir docs/OPERATIONS.md."
            cat /tmp/body
            exit 1
          fi
          echo "Projet Supabase actif ✅"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
